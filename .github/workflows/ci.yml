name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  quality:
    name: Format, analyze & test
    # Pull requests from branches of this repository are already covered by
    # the push event; only run the PR event for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Host tests link the system SQLite (see `hooks:` in pubspec.yaml).
      - name: Install SQLite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Get packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  android:
    name: Build Android
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK
        # CI builds use the run number as the build number so every artifact
        # is distinguishable; releases use the build number from pubspec.yaml.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: daysteps-ci-${{ github.run_number }}-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  web:
    name: Build web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build web app
        run: |
          flutter build web --release --no-web-resources-cdn --web-content-hash \
            --base-href /Daysteps/ --build-number=${{ github.run_number }}
          python3 tool/web/finalize_build.py build/web

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: daysteps-ci-${{ github.run_number }}-web
          path: build/web
          retention-days: 14
