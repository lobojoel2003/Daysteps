name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please don't include photos of children.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Daysteps version
      description: Settings → About Daysteps
      placeholder: 1.0.0 (build 1)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where do you use Daysteps?
      options:
        - Android phone
        - Android tablet
        - Web browser (Chrome / Edge)
        - Web browser (Firefox)
        - Web browser (Safari)
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: e.g. Samsung Galaxy Tab A7, Android 12
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a board
        2. Tap …
